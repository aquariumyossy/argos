[package]
name = "argos"
version = "1.4.5"
description = "Argos  Elocal desktop instant search"
authors = ["Shuhei Yoshida"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "argos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
thiserror = "2"
parking_lot = "0.12"
arboard = "3"
enigo = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tantivy = "0.25"
xxhash-rust = { version = "0.8.18", features = ["xxh64"] }
pdf-extract = "0.8"
zip = "2"
quick-xml = "0.37"
# Legacy Word 97 E003 (.doc); default-features off to skip .docx (we already handle that)
rwml = { version = "0.1", default-features = false }
# Ichitaro / JustSystems JTD text extraction
rjtd-core = "0.0.1"
# Excel .xls / .xlsx
calamine = "0.36"
notify = "7"
walkdir = "2"
lindera-tantivy = { version = "4.0.0", features = ["embed-ipadic"] }
lindera = { version = "4.0.1", features = ["embed-ipadic"] }
tauri-plugin-autostart = "2.5.1"
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_NetworkManagement_WNet", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
encoding_rs = "0.8"
